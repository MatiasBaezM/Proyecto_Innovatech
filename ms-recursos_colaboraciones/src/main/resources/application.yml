spring:
  application:
    name: ms-recursos_colaboraciones
  datasource:
    url: jdbc:postgresql://postgres:5432/recursos_db
    username: postgres
    password: password
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8083
