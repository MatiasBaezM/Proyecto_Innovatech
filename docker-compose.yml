version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - innovatech_network

  mongo:
    image: mongo:6
    container_name: mongo_db
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    networks:
      - innovatech_network

  ms-autenticacion:
    build: ./ms-autenticacion
    container_name: ms-autenticacion
    ports:
      - "8081:8081"
    depends_on:
      - postgres
    networks:
      - innovatech_network

  ms-gestion-proyectos:
    build: ./ms-gestion_proyectos
    container_name: ms-gestion-proyectos
    ports:
      - "8082:8082"
    depends_on:
      - postgres
    networks:
      - innovatech_network

  ms-recursos-colaboraciones:
    build: ./ms-recursos_colaboraciones
    container_name: ms-recursos-colaboraciones
    ports:
      - "8083:8083"
    depends_on:
      - postgres
    networks:
      - innovatech_network

  ms-analiticas:
    build: ./ms-analiticas
    container_name: ms-analiticas
    ports:
      - "8084:8084"
    depends_on:
      - mongo
    networks:
      - innovatech_network

  ms-api-gateway:
    build: ./ms-api_gateway
    container_name: ms-api-gateway
    ports:
      - "8080:8080"
    depends_on:
      - ms-autenticacion
      - ms-gestion-proyectos
      - ms-recursos-colaboraciones
      - ms-analiticas
    networks:
      - innovatech_network

volumes:
  postgres_data:
  mongo_data:

networks:
  innovatech_network:
    driver: bridge
